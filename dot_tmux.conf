# ~/.tmux.conf

# ── General ───────────────────────────────────────────────────────────────
set -g mouse on
set -sg escape-time 0            # no delay for Esc (important inside nvim)
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on      # keep window numbers gapless
set -g history-limit 50000
set -g set-clipboard on         # yank reaches the macOS system clipboard
set -g focus-events on
setw -g mode-keys vi

# True color (Ghostty + nvim). default-terminal must be a 256-color terminfo.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Prefix: C-b → C-a ────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Keybindings ──────────────────────────────────────────────────────────
# Splits open in the current pane's directory; intuitive | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# New window in current path
bind c new-window -c "#{pane_current_path}"
# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
# vi-style copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ── Plugins (TPM) ────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across tmux + nvim
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin options (read when the plugin loads)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# Initialize TPM (loads the plugins above)
run '~/.tmux/plugins/tpm/tpm'

# ── Status line (must come AFTER tpm so catppuccin module vars exist) ─────
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
